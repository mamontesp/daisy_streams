[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "daisy-streams"
version = "0.1.0"
description = "Daisy Streams — End-to-End Streaming & Intelligence Platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "boto3>=1.28.0",
    "snowflake-connector-python>=3.0.0",
    "psycopg[binary]>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "confluent-kafka>=2.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["services/snowflake_adapter/tests", "services/postgres/tests", "services/consumer/tests", "services/api/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
